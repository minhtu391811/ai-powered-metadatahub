# REST/Web UI
rest.port: 8081

# Memory & TaskManager
jobmanager.rpc.address: localhost
jobmanager.memory.process.size: 1024m
taskmanager.memory.process.size: 2048m
taskmanager.numberOfTaskSlots: 4
parallelism.default: 2

# Catalog Store - Gravitino connector
table.catalog-store.kind: gravitino
table.catalog-store.gravitino.gravitino.metalake: metalake_demo
table.catalog-store.gravitino.gravitino.uri: http://gravitino:8090
# table.catalog-store.gravitino.gravitino.client.socketTimeoutMs: 60000
# table.catalog-store.gravitino.gravitino.client.connectionTimeoutMs: 60000

# OAuth2 settings for Gravitino
# table.catalog-store.gravitino.gravitino.client.oauth2.serverUri: http://localhost:8080
# table.catalog-store.gravitino.gravitino.client.oauth2.tokenPath: /realms/gravitinorealm/protocol/openid-connect/token
# table.catalog-store.gravitino.gravitino.client.oauth2.credential: gravitino-client:01dcjxJEy89J7pBDNPzYbf5gBpGzk5IM
# table.catalog-store.gravitino.gravitino.client.oauth2.scope: openid

# Optional: logging level
execution.checkpointing.interval: 10s