# THE CONFIGURATION FOR Gravitino SERVER
gravitino.server.shutdown.timeout = 3000

# THE CONFIGURATION FOR Gravitino WEB SERVER
# The host name of the built-in web server
gravitino.server.webserver.host = 0.0.0.0
# The http port number of the built-in web server
gravitino.server.webserver.httpPort = 8090
# The min thread size of the built-in web server
gravitino.server.webserver.minThreads = 24
# The max thread size of the built-in web server
gravitino.server.webserver.maxThreads = 200
# The stop timeout of the built-in web server
gravitino.server.webserver.stopTimeout = 30000
# The timeout of idle connections
gravitino.server.webserver.idleTimeout = 30000
# The executor thread pool work queue size of the built-in web server
gravitino.server.webserver.threadPoolWorkQueueSize = 100
# The request header size of the built-in web server
gravitino.server.webserver.requestHeaderSize = 131072
# The response header size of the built-in web server
gravitino.server.webserver.responseHeaderSize = 131072

# THE CONFIGURATION FOR Gravitino ENTITY STORE
# The entity store to use
gravitino.entity.store = relational
# The backend for the entity store, we only supports JDBC
gravitino.entity.store.relational = JDBCBackend

# The JDBC URL for the entity store
gravitino.entity.store.relational.jdbcUrl = jdbc:mysql://mysql:3306/gravitino
# The JDBC driver class name
gravitino.entity.store.relational.jdbcDriver = com.mysql.cj.jdbc.Driver
# The JDBC user name
gravitino.entity.store.relational.jdbcUser = gravitino
# The JDBC password
gravitino.entity.store.relational.jdbcPassword = gravitino

# THE CONFIGURATION FOR Gravitino STORAGE CACHE
# Whether to enable the cache
gravitino.cache.enabled=true
# Specify the cache implementation (no need to use the fully qualified class name)
gravitino.cache.implementation=caffeine
# Maximum number of entries allowed in cache
gravitino.cache.maxEntries=10000
# Cache expiration time (in milliseconds)
gravitino.cache.expireTimeInMss=3600000
# Whether to enable cache statistics logging
gravitino.cache.enableStats=true
# Whether to enable weight-based eviction
gravitino.cache.enableWeigher=false
# Number of lock segments for cache concurrency optimization
gravitino.cache.lockSegments=16

# THE CONFIGURATION FOR Gravitino CATALOG
# The interval in milliseconds to evict the catalog cache
gravitino.catalog.cache.evictionIntervalMs = 3600000

# THE CONFIGURATION FOR authorization
# Whether Gravitino enable authorization or not
gravitino.authorization.enable = true
# Close metadata authorization
gravitino.authorization.impl = org.apache.gravitino.server.authorization.PassThroughAuthorizer
# The admins of Gravitino service, multiple admins are spitted by comma.
gravitino.authorization.serviceAdmins = anonymous

# # THE CONFIGURATION FOR HTTPS
# # Whether to enable HTTPS
# gravitino.server.webserver.enableHttps = true  
# # The HTTPS port number of the built-in web server  
# gravitino.server.webserver.httpsPort = 8433  
# # Keystore path
# gravitino.server.webserver.keyStorePath = /tmp/gravitino/keystore.jks  
# # Keystore password
# gravitino.server.webserver.keyStorePassword = localhost  
# # Manager password for the keystore
# gravitino.server.webserver.managerPassword = localhost  
# # Keystore type, JKS or PKCS12
# gravitino.server.webserver.keyStoreType = JKS

# THE CONFIGURATION FOR CORS
# Whether to enable CORS filter
gravitino.server.webserver.enableCorsFilter = true  
# Allowed Origins, use '*' to allow all origins
gravitino.server.webserver.allowedOrigins = * 
# Allowed HTTP methods 
gravitino.server.webserver.allowedMethods = GET,POST,HEAD,DELETE,PUT,PATCH, OPTIONS
# Allowed HTTP headers
gravitino.server.webserver.allowedHeaders = X-Requested-With,Content-Type,Accept,Origin,Authorization  
# Whether to allow credentials
gravitino.server.webserver.allowCredentials = true
# Max age for preflight requests in seconds
gravitino.server.webserver.preflightMaxAgeInSecs = 1800
# Exposed headers
gravitino.server.webserver.exposedHeaders = X-Custom-Header
# Whether to chain preflight requests to the next handler
gravitino.server.webserver.chainPreflight = true

