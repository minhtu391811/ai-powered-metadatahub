# THE CONFIGURATION FOR AUXILIARY SERVICE
# Auxiliary service names, separate by ','
gravitino.auxService.names = iceberg-rest
# Iceberg REST service classpath
gravitino.iceberg-rest.classpath = iceberg-rest-server/libs, iceberg-rest-server/conf
# Iceberg REST service host
gravitino.iceberg-rest.host = 0.0.0.0
# Iceberg REST service http port
gravitino.iceberg-rest.httpPort = 9001
gravitino.iceberg-rest.catalog-backend = jdbc
gravitino.auxService.iceberg-rest.uri = jdbc:mysql://mysql:3306/db
gravitino.auxService.iceberg-rest.warehouse = hdfs://hive:9000/user/iceberg/warehouse/
gravitino.auxService.iceberg-rest.jdbc.user = mysql
gravitino.auxService.iceberg-rest.jdbc.password = mysql
gravitino.auxService.iceberg-rest.jdbc-driver = com.mysql.cj.jdbc.Driver

# THE CONFIGURATION FOR AUDIT LOG
# The audit log enable flag
gravitino.audit.enabled = true
# The class name of audit log writer
gravitino.audit.writer.className = org.apache.gravitino.audit.FileAuditWriter
# The class name of audit log formatter
gravitino.audit.formatter.className = org.apache.gravitino.audit.SimpleFormatter
# The flush interval time of the audit file in seconds
gravitino.audit.writer.file.flushIntervalSecs = 10
# Whether the log will be written to the end or the beginning of the file
gravitino.audit.writer.file.append = true

# THE CONFIGURATION FOR LINEAGE
gravitino.lineage.source = http
gravitino.lineage.http.sourceClass = org.apache.gravitino.lineage.source.HttpSource
gravitino.lineage.processorClass = org.apache.gravitino.lineage.processor.NoopProcessor
gravitino.lineage.sinks = log
gravitino.lineage.log.sinkClass = org.apache.gravitino.lineage.sink.LineageLogSink
gravitino.lineage.queueCapacity = 10000