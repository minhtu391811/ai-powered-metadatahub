services:
  gravitino:
    image: apache/gravitino:${GRAVITINO_IMAGE_TAG}
    entrypoint: /bin/bash /tmp/gravitino/init.sh
    ports:
      - "8090:8090"
      - "9001:9001"
    container_name: metadatahub-gravitino
    depends_on:
      hive:
        condition: service_healthy
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgresql:
        condition: service_started
      kafka:
        condition: service_started
      # keycloak:
      #   condition: service_healthy
    volumes:
      - ./healthcheck:/tmp/healthcheck
      - ./init/gravitino:/tmp/gravitino
    healthcheck:
      test: ["CMD", "/tmp/healthcheck/gravitino-healthcheck.sh"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 20s

  hive:
    image: apache/gravitino-playground:${HIVE_IMAGE_TAG}
    ports:
      - "3307:3306"
      - "19000:9000"
      - "19083:9083"
      - "60070:50070"
      - "19028:9028"
      - "19008:9008"
    container_name: metadatahub-hive
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - HADOOP_USER_NAME=root
    entrypoint: /bin/bash /tmp/hive/init.sh
    volumes:
      - ./init/hive:/tmp/hive
    healthcheck:
      test: ["CMD", "/tmp/check-status.sh"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 20s
    cpus: 2.0
    mem_limit: 2g

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG}
    container_name: metadatahub-minio
    ports:
      - "9000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - ./data/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  mc:
    image: minio/mc:${MC_IMAGE_TAG}
    container_name: metadatahub-mc
    depends_on:
      - minio
    restart: on-failure
    entrypoint: /bin/sh /tmp/minio/init.sh
    volumes:
      - ./init/minio:/tmp/minio

  postgresql:
    image: postgres:${POSTGRESQL_IMAGE_TAG}
    container_name: metadatahub-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    ports:
      - "15432:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d/
      - ./data/postgresql/data:/var/lib/postgresql/data

  mysql:
    image: mysql:${MYSQL_IMAGE_TAG}
    container_name: metadatahub-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "13306:3306"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d/
      - ./healthcheck:/tmp/healthcheck
      - ./data/mysql/data:/var/lib/mysql
    command: 
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "/bin/bash", "/tmp/healthcheck/mysql-healthcheck.sh"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 20s

  kafka:
    image: bitnami/kafka:${KAFKA_IMAGE_TAG}
    container_name: metadatahub-kafka
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_KRAFT_CLUSTER_ID: "abcdefghijklmnopqrstuv"
    command: >
      bash -c "
        /opt/bitnami/scripts/kafka/run.sh &
        pid=$!;
        bash /tmp/kafka/init.sh;
        wait $pid
      "
    volumes:
      - ./init/kafka:/tmp/kafka

  spark:
    image: spark:${SPARK_IMAGE_TAG}
    container_name: metadatahub-spark
    depends_on:
      gravitino:
        condition: service_healthy
    entrypoint: /bin/bash /tmp/spark/init.sh
    environment:
      - HADOOP_USER_NAME=root
      - HIVE_HOST_IP=hive
      - MYSQL_HOST_IP=mysql
      - SPARK_CONNECTOR_JAR=${SPARK_CONNECTOR_JAR}
      - GRAVITINO_VERSION=${GRAVITINO_VERSION}
    ports:
      - "14040:4040"
    volumes:
      - ./init/spark:/tmp/spark
      - ./init/common:/tmp/common
      - ./healthcheck:/tmp/healthcheck
    healthcheck:
      test: ["CMD", "/tmp/healthcheck/spark-healthcheck.sh"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 20s
    
  flink:
    image: flink:${FLINK_IMAGE_TAG}
    container_name: metadatahub-flink
    depends_on:
      gravitino:
        condition: service_started
    entrypoint: /bin/bash /tmp/flink/init.sh
    environment:
      - HADOOP_USER_NAME=root
      - HIVE_HOST_IP=hive
      - MYSQL_HOST_IP=mysql
      - FLINK_CONNECTOR_JAR=${FLINK_CONNECTOR_JAR}
      - GRAVITINO_VERSION=${GRAVITINO_VERSION}
    ports:
      - "18081:8081"
    volumes:
      - ./init/flink:/tmp/flink

  trino:
    image: apache/gravitino-playground:${TRINO_IMAGE_TAG}
    ports:
      - "18080:8080"
    container_name: metadatahub-trino
    environment:
      - HADOOP_USER_NAME=root
      - GRAVITINO_HOST_IP=gravitino
      - GRAVITINO_HOST_PORT=8090
      - GRAVITINO_METALAKE_NAME=metalake_demo
      - HIVE_HOST_IP=hive
      - MYSQL_HOST_IP=mysql
      - POSTGRESQL_HOST_IP=postgresql
    entrypoint: /bin/bash /tmp/trino/init.sh
    volumes:
      - ./init/trino:/tmp/trino
      - ./init/common:/tmp/common
      - ./healthcheck:/tmp/healthcheck
    depends_on:
      hive:
        condition: service_healthy
      gravitino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/tmp/healthcheck/trino-healthcheck.sh"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 20s
    cpus: 2.0
    mem_limit: 2g

  jupyter:
    image: jupyter/pyspark-notebook:${JUPYTER_IMAGE_TAG}
    container_name: metadatahub-jupyter
    ports:
      - "18888:8888"
    volumes:
      - ./init/jupyter:/tmp/gravitino
      - ./data/jupyter/data:/home/jovyan
      - ./data/jupyter/envs/flink-py310:/opt/conda/envs/flink-py310
    entrypoint: /bin/bash /tmp/gravitino/init.sh
    environment:
      - SPARK_CONNECTOR_JAR=${SPARK_CONNECTOR_JAR}
      - FLINK_CONNECTOR_JAR=${FLINK_CONNECTOR_JAR}
    depends_on:
      hive:
        condition: service_healthy
      gravitino:
        condition: service_healthy

